# 논문 목록. 위에 있을수록 페이지 위쪽에 표시돼요.
# 새 논문은 블록 하나를 복사해서 맨 위에 붙이면 끝.
#   image:     대표 그림 (선택). images/ 폴더에 넣고 경로를 적으면 왼쪽에 썸네일이 생겨요.
#   highlight: true 로 두면 배경색이 들어간 강조 행으로 표시돼요.
#   summary:   한두 문장 요약 (선택)
#   award:     수상 등 (선택). 학회 이름 옆에 굵은 빨간 글씨로 표시돼요.

- title: "Enhancing Continual Learning of Vision-Language Models via Dynamic Prefix Weighting"
  authors: "Hyeonseo Jang, <b>Hyuk Kwon</b>, Kibok Lee"
  venue: "CVPR 2026"
  summary: "Gives each prefix its own input-dependent weight, so vision-language models adapt only where needed when learning new domains and classes over time."
  links:
    - name: arXiv
      url: https://arxiv.org/abs/2604.18075

- title: "Automated Model Evaluation for Object Detection via Prediction Consistency and Reliability"
  authors: "Seungju Yoo, <b>Hyuk Kwon</b>, Joong-Won Hwang, Kibok Lee"
  venue: "ICCV 2025 (Oral)"
  award: "Best Paper Award Candidate"
  summary: "Estimates how well an object detector performs on new data without any labels, by checking how consistent and reliable its boxes are before and after NMS."
  highlight: true
  links:
    - name: arXiv
      url: https://arxiv.org/abs/2508.12082

- title: "Rethinking Open-World Semi-Supervised Learning: Distribution Mismatch and Inductive Inference"
  authors: "Seongheon Park*, <b>Hyuk Kwon*</b>, Kwanghoon Sohn, Kibok Lee"
  venue: "CVPR Workshops 2024"
  summary: "Revisits open-world semi-supervised learning under realistic conditions: mismatched class distributions between labeled and unlabeled data, and evaluation on unseen test data."
  links:
    - name: arXiv
      url: https://arxiv.org/abs/2405.20829
