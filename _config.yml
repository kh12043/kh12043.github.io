# ── 블로그 설정 ──
permalink: /blog/:title/
markdown: kramdown
kramdown:
  math_engine: null   # 수식은 KaTeX가 브라우저에서 렌더링
  syntax_highlighter: rouge

# GitHub Pages가 기본 지원하는 플러그인
plugins:
  - jekyll-feed       # /feed.xml RSS 자동 생성
  - jekyll-seo-tag    # 공유 카드(Open Graph) 메타태그 자동 생성
  - jekyll-sitemap    # 검색엔진용 sitemap.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
