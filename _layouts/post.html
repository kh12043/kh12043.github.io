---
layout: default
---
<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-meta">
    {{ page.date | date: "%b %-d, %Y" }}
    {% assign words = content | number_of_words %}
    · {{ words | divided_by: 200 | plus: 1 }} min read
  </p>
  {% if page.image %}<img class="post-cover" src="{{ page.image | relative_url }}" alt="">{% endif %}
  <div class="post-body">
    {{ content }}
  </div>
  <p class="share">
    Share:
    <a href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}&url={{ page.url | absolute_url | url_encode }}">X / Twitter</a> ·
    <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ page.url | absolute_url | url_encode }}">LinkedIn</a>
  </p>
</article>
